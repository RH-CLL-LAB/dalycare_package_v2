name: all_pathology
status: RELEASED
former_name: ""
purpose: >-
  Pathology diagnoses from SDS, built by clean_SDS_pato() from
  SDS_fctrekvisition (patient and requisition date) joined to
  SDS_dimpatologiskdiagnose (SNOMED diagnosis code) on dw_ek_rekvisition. The
  codes are SNOMED/histology codes, not ICD-10 (translation to follow). sor and
  shak codes from the biopsy ordering department/clinic are translated using
  Codes_SHAK_long and Codes_sor. SNOMED codes are translated using Codes_SNOMED.
  material_type is specified from the topographical SNOMED code with each
  material_number (i.e. SNOMED codes starting with "T"; e.g. bone marrow).
sources:
  - "SDS: fctrekvisition, dimpatologiskdiagnose"
one_row: >-
  One SNOMED diagnosis code, for one patient, on one requisition date. Long
  format: a requisition with several SNOMED codes gives several rows.
columns:
  patientid: ""
  date_biopsy: "requisition date (dato_rekvirering from fctrekvisition), which specifies the date of biopsy"
  snomed: "SNOMED diagnosis code (diagnose_snomed_kode from dimpatologiskdiagnose)"
  text: "SNOMED codes translated into pathology diagnosis (e.g. \"myelomatose\")"
  sor_name: "Name of the ordering department/clinic, translated from the sor code (rekvirerende_afd_sor_kode) using Codes_sor (SOR-kode -> Enhedsnavn). NA if the code is missing or not found"
  material_number: "Each patient may have multiple biopsies performed for each requisition (e.g. colon and caecum biopsies in one colonoscopy; peripheral blood and bone marrow). material_number identifies each biopsy from materialenummer"
  snomed_number: "Each biopsy may be associated with multiple SNOMED codes (e.g. 1. bone marrow with 2. CLL and 3. TP53 mutated). snomed_number identifies each SNOMED pathology code from diagnose_snomed_sekvensnummer"
cleaning:
  - "The join between fctrekvisition and dimpatologiskdiagnose is on dw_ek_rekvisition (many-to-many). It replaces the old k_rekvnr key and the old SDS_pato table."
caveats:
  - "The date is the requisition (biopsy) date, not the date the pathology diagnosis was made."
  - "sor and sor_name are filled for only a small share of the requisitions (about 1-2%), because the sor code is mostly missing in the delivered SDS data; of the codes that are present, most can be translated to a unit name. shak, hospital and clinic are much more complete (about two thirds of the rows have a hospital), so use those to identify the ordering department."
  - "Free-text pathology notes (v_fritekst, formerly SDS_t_mikro_ny) are no longer delivered by pato and are not part of this table (since 2025)."
