name: all_patients
status: RELEASED
former_name: patient
purpose: >-
  All patients collected across SDS, SP, SUNDK. Restricted to patients in the
  DALYCARE cohort: >=1 approved dalycare diagnosis, aged >=18 at diagnosis
  (except pathology-derived diagnoses where the patient's current age just
  needs to be 18), and not opted out of research (tissue register). Enriched
  with vital status and death/follow-up date based on SDS data only.
sources:
  - SDS
  - SP
  - SUNDK
one_row: >-
  One patient. Wide format: each patient appears exactly once, with all
  attributes (sex, vital status, dates) as columns on that single row.
columns:
  patientid: ""
  sex: ""
  status: "1=dead, 0=alive, NA=unknown"
  date_birth: ""
  date_death_fu: "death date if dead, shared SDS follow-up date if alive"
caveats:
  - "The coverage period differs between the sources (SDS, SP, SUNDK), so do not assume the same period for all of them."
  - "status and date_death_fu are based on SDS only. A patient who is not in the SDS patient table, for example a new patient contributed only by SP or SUNDK, gets status NA and date_death_fu NA (not assumed alive)."
  - "For patients in SDS who are alive, date_death_fu is one shared follow-up date (the latest death date seen in the SDS death sources). If SP or SUNDK data are more recent than SDS, events can occur after date_death_fu. date_death_fu is a column in this table: use it as the end of follow-up when SDS is the most up-to-date source."
  - "To follow events when SP or SUNDK is the most up-to-date source, use date_death_fu_all_sources in patient_data_overview instead (latest delivery date among the sources the patient appears in, capped at the death date for the dead)."
