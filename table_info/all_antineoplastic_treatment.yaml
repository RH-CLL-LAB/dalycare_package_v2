name: all_antineoplastic_treatment
status: PLANNED
former_name: antineoplastic_treatment
purpose: >-
  Cancer-directed treatment history: chemotherapy, immunotherapy, targeted
  therapy, stem-cell transplant/support - across sources.
sources:
  - "SDS: epikur, ekokur, indberetningmedpris, LPR1+3"
  - "SP: AdministreretMedicin, OrdineretMedicin, Behandlingsplaner_del1, Behandlingsplaner_del2"
  - "SUNDK: CLL, DaMyDa, LYFO"
one_row: >-
  One treatment per patient per date per source. Long format: a patient with a
  6-month chemo regimen appears in one row per administered treatment date.
columns:
  patientid: ""
  tx_text: ""
  tx_code: ""
  tx_code_type: ""
  date_start: ""
  date_end: ""
  region: ""
  hospital: ""
  source: ""
  dx_text: ""
  dx_code: ""
  dx_code_type: ""
  source_id: ""
  n_cycles: ""
