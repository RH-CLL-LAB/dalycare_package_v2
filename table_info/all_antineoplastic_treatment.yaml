  code_icd10: ""
  dx_text_eng: ""
caveats:
  - "The coverage period differs between the sources (SDS, SP, SUNDK), so do not assume the same period for all of them."
  - "Data from SUNDK has a single date for the whole line, meaning that you cannot be sure the individual drugs were given on that date."
  - "To identify specific drugs, use the drug name in tx_text. Currently it is not possible to rely solely on ATC codes, as LPR uses SKS codes and SUNDK uses no codes."
  - "Use data from source SP beh (treatment plans from SP) carefully. The name of the treatment plan is used to generate tx_text, and physicians can (and do) change what a patient is actually given without changing the name. It is best suited for brand new treatments that have not yet been assigned an ATC code."
  - "The diagnosis columns should be used carefully. They do not always make sense, and a drug can easily be given for another condition than what is listed."
