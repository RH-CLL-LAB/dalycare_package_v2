name: all_comorbidity_and_ae
status: RELEASED
former_name: comorbidity_and_ae
purpose: >-
  Comorbidities and adverse events, covering CTCAE-graded adverse events,
  hypertension, type 2 diabetes, infections (5 definitions, one of them
  intravenous antibiotics) and AKI (acute kidney injury, one row per episode; the per-measurement table is all_AKI).
sources:
  - SDS_epikur/ekokur
  - "SP_AdministreretMedicin/OrdineretMedicin (infections - by ATC code)"
  - all_laboratory_measurements (CTCAE, AKI)
  - "SDS diagnoses (T2D, ICD-10 DE11)"
one_row: >-
  One comorbidity/adverse-event episode for one patient, tagged by event_type:
  each of the sub-calculations (CTCAE-graded lab AE, AKI, hypertension, T2D,
  infections) contributes rows in the same shape.
open_questions:
  - "Suggestion from Emelie: should the table also include CLL-CI, CCI and MACE (MACE as recently defined by Noomi for her glycemic control study)? If so, CLL-CI and MACE use procedure codes (SKS), which must then be added as a source."
  - "Some CTCAE grades can be calculated from laboratory measurements alone, but others need an index date (e.g. a baseline for relative changes). Consider calculating these from the index date in a first-line treatment table, once such a table exists."
  - "T2D definition: the R package has no prescription-based definition. The only T2D code is ICD-10 ^DE11 in NMI.R (diagnosis code) and the E11x codes in CCI; neither uses prescriptions or excludes GLP-1 drugs. Noomi's code (prescription criteria, GLP-1 drugs excluded) is to be obtained and aligned. Currently specified here as ATC A10 (SDS_epikur/ekokur, SP medicine) plus ICD-10 DE11 (SDS diagnoses)."
  - "Code matching to check in the R package: NMI.R may match only a patient's first code (^ anchors the start of the combined string), CCI_v2.R matches substrings anywhere (no ^)."
  - "Method of each part: docs/all_comorbidity_and_ae.md."
columns:
  patientid: ""
  event_id: ""
  start_date: ""
  end_date: ""
  duration_days: ""
  event_value: ""
  max_value: ""
  event_type: ""
cleaning:
  - "CTCAE-graded adverse events use CTCAE version 5, as cited in the comments of the AE_* functions (the version is not set as a constant in the code; only the hyperkalaemia thresholds have been spot-checked against v5). Version 6 is not included."
  - "ICD-10 and ATC codes are matched by prefix with regular expressions in the R functions, not by exact match."
caveats:
  - "The coverage period differs between the sources (SDS, SP), so do not assume the same period for all of them."
  - "AKI (ae_AKI) is based on the KDIGO definition with a fourth criterion that is not part of the official definition: creatinine at least 1.5 times the most recent value (added by the author of the script because the data may not have enough measurements for the 48 hour and 7 day windows). AKI in this table therefore deviates from KDIGO, which should be stated in publications."
  - "Hypertension (hypertension event) uses a prescription window of 365 days before the first malignant diagnosis. This differs from the original hypertension paper, which used 180 days; 365 days was chosen after a later study found it better."
  - "Infections (all 5 definitions) are based on SP (blood cultures, administered and prescribed medicine) and are not nation-wide: they are biased in time and region, so infections cannot be defined for the whole cohort, whichever definition is used. Administered medicine only exists in SP. It is planned to include any antibiotic from the prescription registry in definitions 4 and 5 (in-hospital antibiotics before 2018 will still be missed), and to compare definitions 2 and 4 within the SP area and nationwide."
